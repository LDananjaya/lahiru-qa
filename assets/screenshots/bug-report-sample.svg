<svg xmlns="http://www.w3.org/2000/svg" width="980" height="680" viewBox="0 0 980 680" role="img" aria-labelledby="title desc">
  <title id="title">Sample QA bug report</title>
  <desc id="desc">A structured bug report showing severity, steps, expected result, actual result, and evidence.</desc>
  <rect width="980" height="680" fill="#f4f7f9"/>
  <rect x="42" y="42" width="896" height="596" rx="18" fill="#ffffff" stroke="#d8e0e7"/>
  <rect x="42" y="42" width="896" height="72" rx="18" fill="#17202a"/>
  <text x="78" y="88" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Bug Report - Checkout Validation</text>
  <rect x="78" y="146" width="132" height="34" rx="17" fill="#fde8e8"/>
  <text x="101" y="169" fill="#b42318" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">High Severity</text>
  <rect x="226" y="146" width="110" height="34" rx="17" fill="#e9f5f2"/>
  <text x="250" y="169" fill="#115e59" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Web App</text>
  <rect x="78" y="214" width="430" height="118" rx="14" fill="#f8fbfc" stroke="#d8e0e7"/>
  <text x="104" y="252" fill="#17202a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Issue</text>
  <text x="104" y="286" fill="#526170" font-family="Arial, Helvetica, sans-serif" font-size="16">Payment form accepts an invalid expiry date</text>
  <text x="104" y="314" fill="#526170" font-family="Arial, Helvetica, sans-serif" font-size="16">and allows checkout to continue.</text>
  <rect x="78" y="362" width="430" height="160" rx="14" fill="#ffffff" stroke="#d8e0e7"/>
  <text x="104" y="402" fill="#17202a" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Steps to Reproduce</text>
  <text x="104" y="438" fill="#526170" font-family="Arial, Helvetica, sans-serif" font-size="16">1. Open checkout</text>
  <text x="104" y="470" fill="#526170" font-family="Arial, Helvetica, sans-serif" font-size="16">2. Enter card expiry date 00/20</text>
  <text x="104" y="502" fill="#526170" font-family="Arial, Helvetica, sans-serif" font-size="16">3. Submit payment form</text>
  <rect x="548" y="146" width="338" height="376" rx="14" fill="#f8fbfc" stroke="#d8e0e7"/>
  <text x="576" y="188" fill="#17202a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Evidence</text>
  <rect x="576" y="216" width="282" height="142" rx="10" fill="#ffffff" stroke="#d8e0e7"/>
  <rect x="604" y="246" width="224" height="18" rx="4" fill="#d8e0e7"/>
  <rect x="604" y="284" width="176" height="18" rx="4" fill="#d8e0e7"/>
  <rect x="604" y="322" width="116" height="22" rx="6" fill="#0f766e"/>
  <text x="576" y="402" fill="#17202a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Expected</text>
  <text x="576" y="432" fill="#526170" font-family="Arial, Helvetica, sans-serif" font-size="15">Show validation error before payment.</text>
  <text x="576" y="478" fill="#17202a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Actual</text>
  <text x="576" y="508" fill="#526170" font-family="Arial, Helvetica, sans-serif" font-size="15">Checkout continues without blocking.</text>
  <rect x="78" y="552" width="808" height="54" rx="12" fill="#fff7e6" stroke="#f1c879"/>
  <text x="106" y="586" fill="#8a5a10" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Clear impact, reproduction steps, expected result, actual result, and evidence included.</text>
</svg>
