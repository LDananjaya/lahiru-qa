<svg xmlns="http://www.w3.org/2000/svg" width="980" height="680" viewBox="0 0 980 680" role="img" aria-labelledby="title desc">
  <title id="title">Sample QA bug report</title>
  <desc id="desc">A structured bug report showing severity, steps, expected result, actual result, and evidence.</desc>
  <rect width="980" height="680" fill="#f4f7f9"/>
  <rect x="42" y="42" width="896" height="596" rx="18" fill="#ffffff" stroke="#d8e0e7"/>
  <rect x="42" y="42" width="896" height="72" rx="18" fill="#17202a"/>
  <text x="78" y="88" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Bug Report - Checkout Validation</text>
  <rect x="78" y="150" width="140" height="36" rx="18" fill="#fde8e8"/>
  <text x="102" y="174" fill="#b42318" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">High Severity</text>
  <rect x="238" y="150" width="118" height="36" rx="18" fill="#e9f5f2"/>
  <text x="264" y="174" fill="#115e59" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Web App</text>
  <text x="78" y="232" fill="#17202a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Issue</text>
  <text x="78" y="268" fill="#526170" font-family="Arial, Helvetica, sans-serif" font-size="18">Payment form accepts invalid expiry date and allows checkout to continue.</text>
  <text x="78" y="328" fill="#17202a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Steps to Reproduce</text>
  <text x="78" y="364" fill="#526170" font-family="Arial, Helvetica, sans-serif" font-size="18">1. Open checkout</text>
  <text x="78" y="396" fill="#526170" font-family="Arial, Helvetica, sans-serif" font-size="18">2. Enter card expiry date 00/20</text>
  <text x="78" y="428" fill="#526170" font-family="Arial, Helvetica, sans-serif" font-size="18">3. Submit payment form</text>
  <rect x="568" y="146" width="318" height="374" rx="14" fill="#f8fbfc" stroke="#d8e0e7"/>
  <text x="596" y="190" fill="#17202a" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Evidence</text>
  <rect x="596" y="218" width="262" height="150" rx="10" fill="#ffffff" stroke="#d8e0e7"/>
  <rect x="620" y="248" width="214" height="20" rx="4" fill="#d8e0e7"/>
  <rect x="620" y="288" width="160" height="20" rx="4" fill="#d8e0e7"/>
  <rect x="620" y="328" width="104" height="24" rx="6" fill="#0f766e"/>
  <text x="596" y="416" fill="#17202a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Expected</text>
  <text x="596" y="448" fill="#526170" font-family="Arial, Helvetica, sans-serif" font-size="16">Show validation error.</text>
  <text x="596" y="492" fill="#17202a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Actual</text>
  <text x="596" y="524" fill="#526170" font-family="Arial, Helvetica, sans-serif" font-size="16">Checkout continues.</text>
  <rect x="78" y="508" width="420" height="64" rx="12" fill="#fff7e6" stroke="#f1c879"/>
  <text x="106" y="548" fill="#8a5a10" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Clear impact, reproduction, and evidence included.</text>
</svg>
