<svg xmlns="http://www.w3.org/2000/svg" width="980" height="680" viewBox="0 0 980 680" role="img" aria-labelledby="title desc">
  <title id="title">Sample regression summary</title>
  <desc id="desc">A regression testing summary dashboard with pass, fail, blocked, and retest counts.</desc>
  <rect width="980" height="680" fill="#f4f7f9"/>
  <rect x="42" y="42" width="896" height="596" rx="18" fill="#ffffff" stroke="#d8e0e7"/>
  <text x="78" y="96" fill="#17202a" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Regression Summary</text>
  <text x="78" y="132" fill="#526170" font-family="Arial, Helvetica, sans-serif" font-size="18">Release candidate validation across core workflows</text>
  <rect x="78" y="178" width="186" height="118" rx="14" fill="#e9f5f2"/>
  <text x="108" y="222" fill="#115e59" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Passed</text>
  <text x="108" y="268" fill="#115e59" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">42</text>
  <rect x="286" y="178" width="186" height="118" rx="14" fill="#fde8e8"/>
  <text x="316" y="222" fill="#b42318" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Failed</text>
  <text x="316" y="268" fill="#b42318" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">5</text>
  <rect x="494" y="178" width="186" height="118" rx="14" fill="#fff7e6"/>
  <text x="524" y="222" fill="#8a5a10" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Blocked</text>
  <text x="524" y="268" fill="#8a5a10" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">2</text>
  <rect x="702" y="178" width="186" height="118" rx="14" fill="#e9eff7"/>
  <text x="732" y="222" fill="#275c8a" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Retest</text>
  <text x="732" y="268" fill="#275c8a" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">7</text>
  <text x="78" y="364" fill="#17202a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Validated Workflows</text>
  <rect x="78" y="398" width="810" height="34" rx="8" fill="#f4f7f9"/>
  <rect x="78" y="452" width="760" height="34" rx="8" fill="#f4f7f9"/>
  <rect x="78" y="506" width="690" height="34" rx="8" fill="#f4f7f9"/>
  <rect x="78" y="398" width="660" height="34" rx="8" fill="#0f766e"/>
  <rect x="78" y="452" width="584" height="34" rx="8" fill="#275c8a"/>
  <rect x="78" y="506" width="506" height="34" rx="8" fill="#b7791f"/>
  <text x="98" y="422" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Checkout and transaction flow</text>
  <text x="98" y="476" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">CRM quote creation and approvals</text>
  <text x="98" y="530" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Mobile responsive validation</text>
</svg>
